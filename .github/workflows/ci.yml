name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v6
        with:
          path: .cache
          key: sources-${{ hashFiles('sources.lock') }}
      - run: deno fmt --check
      - run: deno lint
      - run: deno task test
      - run: deno task build
      - uses: actions/upload-artifact@v7
        with:
          name: dictionary
          path: |
            dist/SKK-JISYO.mahjong-riichi
            dist/SKK-JISYO.mahjong-riichi.L-unique
            dist/provenance.tsv

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tett23/adr-guard@v0.8.1
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          allow-status: true
          allow-links: true
